name: Cross-Repo Rule Guard

# 🔴 2026-08-31 신설 — 대표님: "기록 업데이트 되는 것은 gohotelwinners에서 같이 업데이트 되어야 된다 알지?"
#                     "이런 문제가 발생 안 되게 동시에 업데이트할 수 있는 방법을 찾아."
#
# 무엇을 막나:
#   staycurate 의 GAPS.md 에 «🔴 규칙이 생긴 사고»를 적어놓고
#   tw-b2b 의 결정문서(_business/decisions/)에는 안 올리는 일.
#   → 사고는 블로그 노트에만 남고, «앞으로 이렇게 한다»가 정본에 없어
#      다음 클로드가 그 규칙을 모른 채 같은 실수를 반복한다.
#
#   실제로 2026-08-31 에 그랬다: GAPS 48개 절 중 «🔴 규칙» 절이 15개인데
#   결정문서로 올라간 것은 그날 만든 2건(D-096·D-097)뿐이었다.
#   기존 decision-index-guard 는 tw-b2b «안에서만» 보므로 이 관계를 못 잡는다.
#
# 왜 tw-b2b 에 두나:
#   staycurate 레포에는 GitHub 워크플로가 0개이고 자동 실행 장치가 없다(2026-08-31 실측).
#   GITHUB_PAT 도 스튜디오에만 있다. 그래서 «tw-b2b 가 staycurate 를 읽는» 방향으로 만든다.
#
# 어떻게:
#   ① staycurate/docs/GAPS.md 를 원본 그대로 읽는다 (공개 raw · 열쇠 불필요)
#   ② «## X. 🔴 …» 형태로 🔴 가 붙은 절 = 규칙이 생긴 사고 로 본다
#   ③ 그 절의 날짜(YYYY-MM-DD)를 뽑아, 같은 날짜의 결정문서가 tw-b2b 에 있는지 본다
#   ④ 없으면 GitHub Issue 를 열어 알린다 (자동으로 쓰지 않는다 — 결정 요약은 사람/클로드 몫)
#
#   🔴 «면제 목록»을 둔다. 규칙이 아니라 단순 조치였던 절은 여기에 적어 잡음을 없앤다.
#      면제는 «안 해도 된다»가 아니라 «이건 결정이 아니다»를 사람이 판정한 기록이다.
#
# 헌법 원칙 2(무인 실행)·6(AI 가독성)·7(상태 가시성).

on:
  push:
    branches: [main]
    paths:
      - '_business/decisions/**.md'
      - '.github/workflows/cross-repo-rule-guard.yml'
  schedule:
    - cron: '10 21 * * *'     # 매일 KST 06:10 — decision-index-guard(06:00) 직후
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GAPS 의 «🔴 규칙» 절과 결정문서를 맞대본다
        id: scan
        env:
          # 🔴 staycurate 는 비공개 레포다 — raw 주소는 404 다(2026-08-31 실측).
          #    GITHUB_PAT 로 GitHub API 를 통해 읽는다. 이 열쇠는 스튜디오에만 있다.
          GH_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          python3 - <<'PY'
          import os, re, glob, json, base64, urllib.request

          GAPS_API = 'https://api.github.com/repos/dgmasters01/staycurate/contents/docs/GAPS.md?ref=main'

          # 🔴 면제 — «규칙이 아니라 그날의 조치»였던 절. 사람이 판정해 여기 적는다.
          #    형식: 'AL-3' 처럼 절 이름. 날짜가 같아도 이 이름이면 건너뛴다.
          EXEMPT = {
              'Z',      # 방문자 화면 정리 (그날의 화면 작업)
              'AA',     # D-094 처방 — 이미 결정문서 D-094 가 있다
              'AB',     # 명부 자동 대조 점검기 — 도구 신설
              'AE',     # 발행 스케줄 화면 규격 — 화면 규격은 GAPS 가 정본
              'AG',     # 관리자 화면 전수 점검
              'AK',     # 방문자 화면 마무리
              'AL',     # 성과 화면 규격 (화면 규격은 GAPS 가 정본)
              'AN', 'AO', 'AP',   # 성과 화면 v6~v7 (화면 작업)
              'AT',     # 문서 정합 작업 자체
          }

          try:
              tok = os.environ.get('GH_PAT', '')
              if not tok:
                  raise RuntimeError('GITHUB_PAT 이 없습니다 — 레포 Secrets 에 넣어야 합니다')
              req = urllib.request.Request(GAPS_API, headers={
                  'Authorization': f'Bearer {tok}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'cross-repo-rule-guard',
              })
              raw = json.load(urllib.request.urlopen(req, timeout=30))
              gaps = base64.b64decode(raw['content']).decode('utf-8')
          except Exception as e:
              # 🔴 읽지 못하면 «문제 없음»으로 넘기지 않는다 — 조용히 죽는 감시기가 가장 위험하다.
              #    워크플로를 실패시켜 눈에 띄게 한다.
              print('🔴 GAPS 를 읽지 못했습니다:', e)
              raise SystemExit(1)

          # tw-b2b 쪽에 이미 있는 결정문서의 날짜
          dec_files = sorted(glob.glob('_business/decisions/*.md'))
          dec_dates = set()
          for p in dec_files:
              m = re.search(r'(\d{4}-\d{2}-\d{2})', os.path.basename(p))
              if m:
                  dec_dates.add(m.group(1))

          # GAPS 에서 «## X. 🔴 …» 절을 뽑는다
          missing = []
          for m in re.finditer(r'(?m)^## ([A-Z]{1,2}(?:-\d+)?)\.\s*(.+)$', gaps):
              name, title = m.group(1), m.group(2)
              if '🔴' not in title:
                  continue                      # 규칙이 생긴 절만 본다
              if name in EXEMPT:
                  continue
              d = re.search(r'(\d{4}-\d{2}-\d{2})', title)
              if not d:
                  continue                      # 날짜가 없으면 판정 못 함 — 잡음 방지로 건너뜀
              if d.group(1) in dec_dates:
                  continue                      # 같은 날짜의 결정문서가 있으면 통과
              missing.append((name, d.group(1), title.replace('🔴', '').strip()[:70]))

          print(f'GAPS «🔴 규칙» 절 대조 — 결정문서 {len(dec_files)}개 · 짝 없음 {len(missing)}개')
          for n, d, t in missing:
              print(f'  🔴 {n} ({d}) {t}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'count={len(missing)}\n')
              body = '\n'.join(f'- **GAPS {n}** ({d}) — {t}' for n, d, t in missing)
              f.write('list<<EOF\n' + body + '\nEOF\n')
          PY

      - name: 짝이 없으면 알린다
        if: steps.scan.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          MISSING: ${{ steps.scan.outputs.list }}
          COUNT: ${{ steps.scan.outputs.count }}
        with:
          script: |
            const title = `🔴 블로그 GAPS 의 «규칙» ${process.env.COUNT}건이 결정문서로 안 올라왔습니다`;
            const body = [
              'staycurate `docs/GAPS.md` 에 **🔴 규칙이 생긴 사고**를 적었는데,',
              'tw-b2b `_business/decisions/` 에 **같은 날짜의 결정문서가 없습니다.**',
              '',
              '이 상태면 사고는 블로그 노트에만 남고 «앞으로 이렇게 한다»가 정본에 없어',
              '**다음 채팅의 Claude 가 그 규칙을 모른 채 같은 실수를 반복합니다.**',
              '(2026-08-31 크론 401 사고가 정확히 그랬습니다 — 08-18 에 고친 규칙이 정본에 없었습니다)',
              '',
              '### 짝이 없는 절',
              process.env.MISSING,
              '',
              '### 할 일 (한 건당)',
              '1. `_business/decisions/YYYY-MM-DD-이름.md` 로 결정문서를 만든다 (무엇/왜/결정/조치/검증)',
              '2. `DECISIONS_INDEX.md` 표에 한 행 (ID 는 마지막 번호 다음 · 재사용 금지)',
              '3. `DECISIONS.md` 에 사람용 스토리 (헌법 6조 이중 형식 의무)',
              '4. `_os/context/DECISION-LOOKUP.md` «자주 틀리는 것» 표에 한 줄 — **이게 다음 Claude 가 실제로 보는 곳**',
              '',
              '### 규칙이 아니라 그날의 조치였다면',
              '이 워크플로 파일의 `EXEMPT` 목록에 절 이름을 넣는다.',
              '면제는 «안 해도 된다»가 아니라 **«이건 결정이 아니다»를 사람이 판정한 기록**이다.',
              '',
              '> 이 이슈는 결정문서가 생기면 다음 실행에서 자동으로 닫힙니다.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'cross-repo-rule',
            });
            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['cross-repo-rule'],
              });
            }

      - name: 다 맞으면 열린 이슈를 닫는다
        if: steps.scan.outputs.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'cross-repo-rule',
            });
            for (const i of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: '✅ GAPS 의 «🔴 규칙» 절이 모두 결정문서와 짝이 맞습니다. 자동으로 닫습니다.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }
