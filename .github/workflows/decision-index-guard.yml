name: Decision Index Guard

# 🔴 2026-08-12 신설 — 대표님: "지금 내가 계속 이야기 해야 작업을 하는 거야? 알아서 정리되는 거 아니야?"
#
# 무엇을 막나:
#   `_business/decisions/` 에 결정문서를 만들어 놓고 `DECISIONS_INDEX.md` 에 안 넣는 일.
#   문서는 있는데 «있는 줄 모르는» 상태가 된다. 2026-08-11~12 에 5건이 그랬다.
#   (같은 함정으로 2026-08-11 아침에 D-071 을 못 찾아 거리 우선 매칭으로 틀렸다)
#
# 어떻게:
#   결정문서가 push 되면 인덱스에 그 파일 경로가 적혀 있는지 확인한다.
#   없으면 🔴 GitHub Issue 를 열어 알린다. (자동으로 고치지 않는다 — 결정 요약은 사람/클로드 몫)
#
# 헌법 원칙 2(무인 실행)·6(AI 가독성)·7(상태 가시성).

on:
  push:
    branches: [main]
    paths:
      - '_business/decisions/**.md'
      - 'DECISIONS_INDEX.md'
  schedule:
    - cron: '0 21 * * *'     # 매일 KST 06시 전수 점검
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 인덱스에 빠진 결정문서 찾기
        id: scan
        run: |
          python3 - <<'PY'
          import os, glob, json

          idx = open('DECISIONS_INDEX.md', encoding='utf-8').read() if os.path.exists('DECISIONS_INDEX.md') else ''
          dec = open('DECISIONS.md', encoding='utf-8').read() if os.path.exists('DECISIONS.md') else ''

          missing = []
          for p in sorted(glob.glob('_business/decisions/*.md')):
              name = os.path.basename(p)
              # 인덱스나 스토리 어느 쪽에든 파일명이 적혀 있으면 통과
              if name in idx or name in dec:
                  continue
              missing.append(p)

          print(f"결정문서 {len(glob.glob('_business/decisions/*.md'))}개 · 인덱스 누락 {len(missing)}개")
          for m in missing:
              print("  🔴", m)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"count={len(missing)}\n")
              f.write("list<<EOF\n" + "\n".join(f"- `{m}`" for m in missing) + "\nEOF\n")
          PY

      - name: 빠진 게 있으면 알린다
        if: steps.scan.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          MISSING: ${{ steps.scan.outputs.list }}
          COUNT: ${{ steps.scan.outputs.count }}
        with:
          script: |
            const title = `🔴 결정문서 ${process.env.COUNT}건이 DECISIONS_INDEX.md 에 없습니다`;
            const body = [
              '결정문서를 만들었는데 **인덱스에 등록하지 않았습니다.**',
              '이 상태면 다음 사람(또는 다음 채팅의 Claude)이 그 결정이 있는 줄 모릅니다.',
              '',
              '### 빠진 문서',
              process.env.MISSING,
              '',
              '### 할 일',
              '1. `DECISIONS_INDEX.md` 표에 한 행 추가 (ID는 마지막 번호 다음 · 재사용 금지)',
              '2. `DECISIONS.md` 상단에 스토리 추가 (언제/무엇을/왜/누가)',
              '3. 하단 상세경로표·변경이력도 같이 갱신',
              '',
              '> 이 이슈는 인덱스에 파일명이 적히면 다음 실행에서 자동으로 닫힙니다.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'decision-index',
            });
            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['decision-index'],
              });
            }

      - name: 다 등록됐으면 이슈를 닫는다
        if: steps.scan.outputs.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'decision-index',
            });
            for (const i of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, body: '✅ 모든 결정문서가 인덱스에 등록됐습니다. 자동으로 닫습니다.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }
