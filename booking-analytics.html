<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TW Booking Analytics</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<style>
/* ===== booking-analytics.html — v2 Aurora migration (20차) ===== */
/* shared.css v2 가 base 톤·컬러·폰트·aurora-bg·glass-card·btn 모두 제공 */

/* ---------- Topbar (sticky glass — 17/18/19차 표준) ---------- */
.ba-topbar{
  position:sticky;top:0;z-index:900;
  background:rgba(10,10,15,.72);backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
  padding:0 32px;display:flex;align-items:center;justify-content:space-between;
  height:64px;
}
.ba-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.ba-logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:var(--aurora);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;
  box-shadow:var(--glow-p);
  font-family:var(--display);
}
.ba-logo-text{font-family:var(--display);font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.ba-nav-right{display:flex;gap:10px;align-items:center}
.ba-user{font-size:13px;color:var(--ink-3);margin-right:6px}
.ba-btn-out{
  background:var(--glass);border:1px solid var(--line-2);
  color:var(--ink-2);padding:8px 14px;border-radius:8px;
  cursor:pointer;font-size:13px;font-family:var(--sans);
  text-decoration:none;transition:var(--transition);
}
.ba-btn-out:hover{background:var(--glass-2);color:var(--ink);border-color:var(--line-3)}

/* admin embed 시 topbar 숨김 */
.ba-embed .ba-topbar{display:none}

/* ---------- Container ---------- */
.W{max-width:1100px;margin:0 auto;padding:32px 24px;position:relative;z-index:1}
.H{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
.H h1{font-size:28px;font-weight:700;letter-spacing:-.02em;font-family:var(--display);color:var(--ink);
  background:var(--aurora);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.H .m{font-size:11px;color:var(--ink-3);text-align:right}
.H .u{background:rgba(72,201,176,.15);color:#48c9b0;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:600;border:1px solid rgba(72,201,176,.3)}

/* ---------- KPI cards (글래스 + aurora 그라디언트 텍스트) ---------- */
.G{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.S{
  background:var(--glass);border:1px solid var(--line-2);
  border-radius:14px;padding:18px 20px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:var(--transition);
}
.S:hover{background:var(--glass-2);border-color:var(--line-3)}
.S .l{font-size:11px;color:var(--ink-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.S .v{
  font-size:26px;font-weight:700;font-family:var(--display);letter-spacing:-.02em;
  background:var(--aurora);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.2;
}
.S .s{font-size:11px;color:var(--ink-2);margin-top:4px}

/* ---------- Tabs ---------- */
.T{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto;position:sticky;top:64px;z-index:800;background:var(--bg,#0a0a0f);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);padding-top:4px}
.ba-embed .T{top:0}
.tb{padding:11px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--ink-3);white-space:nowrap;border-bottom:2px solid transparent;font-family:var(--sans);transition:var(--transition)}
.tb.on{color:var(--ink);font-weight:600;border-bottom-color:transparent;background:linear-gradient(transparent 95%,var(--aurora-1) 95%)}
.tb:hover{color:var(--ink)}

/* ---------- Cards / chart wrappers ---------- */
.C{
  background:var(--glass);border:1px solid var(--line-2);
  border-radius:14px;padding:20px;margin-bottom:18px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.C h3{font-size:14px;font-weight:600;margin-bottom:14px;color:var(--ink-2);font-family:var(--sans)}
.cw{position:relative;height:280px;margin-bottom:8px}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);color:var(--ink-3);font-weight:500;font-size:11px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-2)}
tr:hover{background:var(--glass-1)}
tr.ck{cursor:pointer}
tr.ck:hover{background:rgba(139,92,246,.08)}
.r{text-align:right}

/* ---------- Rank badges (aurora 친화) ---------- */
.rk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:700}
.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3a2a08}
.r2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#1e293b}
.r3{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff}
.rn{background:var(--glass-2);color:var(--ink-3);border:1px solid var(--line-2)}

/* ---------- Status badges (다크 친화) ---------- */
.bg{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid}
.bk{background:rgba(139,92,246,.15);color:#a78bfa;border-color:rgba(139,92,246,.3)}
.bj{background:rgba(251,146,60,.15);color:#fb923c;border-color:rgba(251,146,60,.3)}
.bt{background:rgba(56,189,248,.15);color:#38bdf8;border-color:rgba(56,189,248,.3)}
.bv{background:rgba(72,201,176,.15);color:#48c9b0;border-color:rgba(72,201,176,.3)}
.be{background:rgba(236,72,153,.15);color:#ec4899;border-color:rgba(236,72,153,.3)}

/* ---------- Stars ---------- */
.st{color:#fbbf24;font-size:12px;letter-spacing:-1px}

/* ---------- Breadcrumb ---------- */
.bc{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:16px;flex-wrap:wrap;color:var(--ink-2)}
.bc span{color:var(--ink-3)}
.bc a{color:var(--aurora-1);cursor:pointer;text-decoration:none}
.bc a:hover{text-decoration:underline}

/* ---------- Promo banner (aurora gradient) ---------- */
.pb{
  background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(56,189,248,.1));
  border:1px solid rgba(139,92,246,.3);
  border-radius:14px;padding:18px 22px;margin-bottom:18px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.pb h4{font-size:14px;font-weight:600;color:#a78bfa;margin-bottom:6px}
.pb p{font-size:13px;color:var(--ink-2);line-height:1.7}

/* ---------- Filter buttons ---------- */
.fr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fb{
  padding:6px 14px;border-radius:18px;font-size:12px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--glass);color:var(--ink-2);
  font-family:var(--sans);transition:var(--transition);
}
.fb.on{background:var(--aurora);color:#fff;border-color:transparent;box-shadow:var(--glow-p)}
.fb:hover{border-color:var(--line-3);color:var(--ink)}
.fb.on:hover{color:#fff}

/* ---------- Pending / placeholder pills ---------- */
.pn{font-size:11px;color:#fbbf24;background:rgba(251,191,36,.12);padding:3px 8px;border-radius:6px;display:inline-block;border:1px solid rgba(251,191,36,.3)}

/* ---------- Toggle button group ---------- */
.vt{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin-bottom:14px;background:var(--glass)}
.vb{padding:8px 16px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--ink-3);border-right:1px solid var(--line-2);font-family:var(--sans);transition:var(--transition)}
.vb:last-child{border-right:none}
.vb.on{background:var(--aurora);color:#fff}
.vb:hover{color:var(--ink)}
.vb.on:hover{color:#fff}

/* ---------- Inputs ---------- */
.ys{
  padding:6px 12px;border:1px solid var(--line-2);border-radius:8px;
  font-size:12px;background:var(--glass);color:var(--ink);
  font-family:var(--sans);
}
.si{
  padding:9px 14px;border:1px solid var(--line-2);border-radius:10px;
  font-size:13px;width:100%;max-width:420px;margin-bottom:16px;
  background:var(--glass);color:var(--ink);
  font-family:var(--sans);transition:var(--transition);
}
.si:focus{outline:none;border-color:var(--aurora-1);background:var(--glass-2)}
.si::placeholder{color:var(--ink-3)}

/* ---------- 2-col grid ---------- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- Calendar heatmap cells ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px}
.cal-h{text-align:center;font-size:11px;color:var(--ink-3);padding:4px;text-transform:uppercase;letter-spacing:.04em}
.cal-d{
  text-align:center;padding:8px 4px;border-radius:6px;font-size:12px;cursor:pointer;
  border:1px solid transparent;color:var(--ink-2);background:var(--glass);
  transition:var(--transition);
}
.cal-d:hover{border-color:var(--aurora-1);background:var(--glass-2)}
.cal-d .cn{font-weight:600;color:var(--ink)}
.cal-d .ct{font-size:9px;color:var(--ink-3);margin-top:2px}

/* ---------- Pagination ---------- */
.pg{display:flex;gap:4px;justify-content:center;margin:14px 0}
.pg button{
  padding:6px 12px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--glass);cursor:pointer;font-size:12px;color:var(--ink-2);
  font-family:var(--sans);transition:var(--transition);
}
.pg button:hover{border-color:var(--line-3);color:var(--ink)}
.pg button.on{background:var(--aurora);color:#fff;border-color:transparent;box-shadow:var(--glow-p)}

@media(max-width:640px){
  .ba-topbar{padding:0 16px}
  .W{padding:20px 14px}
  .H h1{font-size:22px}
  .G{grid-template-columns:repeat(2,1fr)}
  .S .v{font-size:20px}
  .g2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- 🔴 2026-08-01 전체 점검에서 발견 — 이 페이지의 숫자는 `const D={...}` 로
     **코드에 박힌 고정값**(989KB)이다. DB를 보지 않고, 저절로 갱신되지도 않는다.
     실측 차이(2026-08-01): 예약 3,774 vs 실제 3,850 · 매출 $854,258 vs 실제 $877,679.
     갱신 표기가 없어 보는 사람이 **오늘 숫자로 믿게 된다** → 배지로 명시한다.
     근본 해결(실시간 연동 또는 스튜디오 성과표로 통합)은 BL-ANALYTICS-STATIC 로 등록했다. -->
<div style="position:relative;z-index:9;max-width:1200px;margin:14px auto 0;padding:11px 15px;
     border:1px solid rgba(232,168,73,.45);background:rgba(232,168,73,.10);border-radius:10px;
     font-size:13px;line-height:1.75;color:#e8c48a;">
  <span id="bka-asof">⏳ 자료를 불러오는 중…</span><br>
  <span style="color:#9ab5a8;font-size:12px;">이 화면은 이제 DB 를 직접 센다. 취소된 예약은 뺀다. 10분마다 다시 센다.</span>
</div>

<!-- Aurora background (v2 standard) -->
<div class="aurora-bg" aria-hidden="true">
  <div class="aurora-blob b1"></div>
  <div class="aurora-blob b2"></div>
  <div class="aurora-blob b3"></div>
  <div class="aurora-blob b4"></div>
</div>
<div class="aurora-grid" aria-hidden="true"></div>

<!-- Sticky glass topbar (v2 standard — admin embed 시 .ba-embed로 숨김) -->
<!-- BL-COMMON-HEADER-UNIFY (ba-topbar 클래스 유지: admin embed 시 .ba-embed로 숨김 룰 호환) -->
<header id="tw-common-header" class="ba-topbar"></header>

<div class="W">
<div class="H"><div><h1>TW Booking Analytics</h1></div><div class="m">아고다 2계정 합산<br><span class="u">데이터: 2026.04.15</span></div></div>
<div class="T" id="tabs"></div><div id="ct"></div>
</div>
<script>
/* ===== TW-B2B Booking Analytics — Phase 3 Step 1: IIFE module wrapper =====
 * window.BKA = { init, mount, unmount, invalidateCache } 만 외부 노출.
 * window.initAnalytics 는 BKA.mount 로 위임(하위 호환).
 * standalone 모드에서는 DOMContentLoaded 시 자동 mount.
 */
(function(global){
'use strict';

let D={sm:{tb:0,ta:0,tc:0,te:0,pc:0,aa:0,th:0,tco:0,tci:0},yl:[],ps:{booking:[]},ch:[],co:[],ci:[],hf:[],bk:[],dv:[],dvy:[],dvc:[],dow:[],dom:[],mc:[],dl:[],ss:[],sc:[]};   /* 🔴 2026-08-01 — 여기 990KB가 박혀 있었다. 이제 /api/booking-analytics 가 DB에서 세어서 채운다. */
const F=n=>'$'+Math.round(n).toLocaleString();
const W=n=>'\u20a9'+Math.round(n*1360).toLocaleString();
const P=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
const A=(a,b)=>b?F(a/b):'-';
const E=s=>s.replace(/'/g,"\u2019");
const Ss=n=>'<span class="st">'+'\u2605'.repeat(n)+'<span style="opacity:.2">'+'\u2605'.repeat(5-n)+'</span></span>';
const CB=c=>{if(c.includes('\uD55C\uAD6D')||c.includes('\uD638\uD154\uC774\uC57C'))return'<span class="bg bk">\uD55C\uAD6D</span>';if(c.includes('\uC77C\uBCF8'))return'<span class="bg bj">\uC77C\uBCF8</span>';if(c.includes('\uB300\uB9CC'))return'<span class="bg bt">\uB300\uB9CC</span>';if(c.includes('\uBCA0\uD2B8\uB0A8'))return'<span class="bg bv">\uBCA0\uD2B8\uB0A8</span>';if(c.includes('\uC601\uC5B4'))return'<span class="bg be">\uC601\uC5B4\uAD8C</span>';if(c.includes('\uC720\uD29C\uBE0C')||c.includes('\uC0AC\uC774\uD2B8'))return'<span class="bg bk">\uD55C\uAD6D</span>';return''};
const R=i=>'<span class="rk '+(i<1?'r1':i<2?'r2':i<3?'r3':'rn')+'">'+(i+1)+'</span>';
const SM={'Departed':'\uD22C\uC219\uC644\uB8CC','Charged':'\uCCAD\uAD6C','Confirmed':'\uD655\uC815'};
let ch_=[],CV='booking',SY='all',CT='overview',DS={},HP=0,hsq='',b2bQ='',calYM='2024-06',calDay=null,GR='month';
function dc(){ch_.forEach(c=>c.destroy());ch_=[];}
const TD=[{id:'overview',l:'\uC804\uCCB4 \uD604\uD669'},{id:'channel',l:'\uCC44\uB110\uBCC4'},{id:'country',l:'\uB098\uB77C\uBCC4'},{id:'city',l:'\uB3C4\uC2DC\uBCC4'},{id:'hotel',l:'\uD638\uD154 \uAC80\uC0C9'},{id:'pattern',l:'\uC608\uC57D \uD328\uD134'},{id:'stars',l:'\uC131\uAE09\uBCC4'},{id:'sales',l:'B2B \uC601\uC5C5'}];
function iT(){document.getElementById('tabs').innerHTML=TD.map(t=>'<button class="tb '+(t.id===CT?'on':'')+'" onclick="sT(this.dataset.id)" data-id="'+t.id+'">'+t.l+'</button>').join('')}
function sT(id){CT=id;DS={};HP=0;iT();dc();rr()}
function sV(v){CV=v;dc();rr()}
function sGr(v){GR=v;dc();rr()}
function sYr(v){SY=v;dc();rr()}
function rr(){var el=document.getElementById('ct');try{switch(CT){case'overview':el.innerHTML=rOv();iOC();break;case'channel':el.innerHTML=rCh();iCC();break;case'country':el.innerHTML=rCo();break;case'city':el.innerHTML=rCi();break;case'hotel':el.innerHTML=rHo();break;case'pattern':el.innerHTML=rPa();iPC();break;case'stars':el.innerHTML=rSt();iSC();break;case'sales':el.innerHTML=rSa();break}}catch(e){el.innerHTML='<div class="C"><h3>Error</h3><p>'+e.message+'</p></div>';console.error(e)}}

var VL={booking:'\uC608\uC57D\uC77C',checkout:'\uCCB4\uD06C\uC544\uC6C3',settlement:'\uC815\uC0B0(\uC785\uAE08)'};
function vTg(){return'<div class="vt">'+Object.keys(VL).map(function(k){return'<button class="vb '+(CV===k?'on':'')+'" onclick="sV(this.dataset.v)" data-v="'+k+'">'+VL[k]+'</button>'}).join('')+'</div>'}
var GRL={day:'\uC77C',week:'\uC8FC',month:'\uC6D4',quarter:'\uBD84\uAE30',year:'\uB144'};
function gTg(){return'<div class="vt">'+Object.keys(GRL).map(function(k){return'<button class="vb '+(GR===k?'on':'')+'" onclick="sGr(this.dataset.g)" data-g="'+k+'">'+GRL[k]+'</button>'}).join('')+'</div>'}
function isoWk(dt){var d=new Date(dt+'T00:00:00Z');var day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);var ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));var wk=Math.ceil(((d-ys)/86400000+1)/7);return d.getUTCFullYear()+'-W'+(wk<10?'0'+wk:wk)}
function aggGR(){
  if(GR==='month'){var m=D.ps[CV];return m.map(function(x){return{k:x.ym,kl:x.ym.slice(2),b:x.b,a:x.a,c:x.c}})}
  var src=D.dl,bk={};
  src.forEach(function(r){var dt=r.dt,k,kl;
    if(GR==='day'){k=dt;kl=dt.slice(5)}
    else if(GR==='week'){k=isoWk(dt);kl=k.slice(2)}
    else if(GR==='quarter'){k=dt.slice(0,4)+'-Q'+(Math.floor((parseInt(dt.slice(5,7))-1)/3)+1);kl=k.slice(2)}
    else{k=dt.slice(0,4);kl=k}
    if(!bk[k])bk[k]={k:k,kl:kl,b:0,a:0,c:0};
    bk[k].b+=r.b;bk[k].a+=r.a;bk[k].c+=(r.a*0.04)});
  return Object.keys(bk).sort().map(function(k){var o=bk[k];o.a=Math.round(o.a*100)/100;o.c=Math.round(o.c*100)/100;return o})
}
function grYr(arr){if(SY==='all')return arr;return arr.filter(function(v){return v.k&&v.k.indexOf(String(SY))===0})}
function dArrow(cur,prev){if(prev===0||prev==null)return'<span class="s">\u2014</span>';var pct=(cur-prev)/prev*100;var up=pct>=0;var col=up?'#48c9b0':'#ff6b6b';var ar=up?'\u25B2':'\u25BC';return'<span class="s" style="color:'+col+';font-weight:600">'+ar+' '+Math.abs(pct).toFixed(1)+'%</span>'}
function rDelta(){var a=grYr(aggGR());if(a.length<2)return'';var cur=a[a.length-1],prv=a[a.length-2];var unit=GRL[GR];var cmp=(GR==='year')?'\uC804\uB144':(GR==='month')?'\uC804\uC6D4':(GR==='quarter')?'\uC804\uBD84\uAE30':(GR==='week')?'\uC804\uC8FC':'\uC804\uC77C';
  return'<div class="G">'+
  '<div class="S"><div class="l">\uCD5C\uADFC '+unit+' \uC608\uC57D ('+cur.kl+')</div><div class="v">'+cur.b.toLocaleString()+'\uAC74</div><div>'+cmp+'\uB300\uBE44 '+dArrow(cur.b,prv.b)+'</div></div>'+
  '<div class="S"><div class="l">\uCD5C\uADFC '+unit+' \uAE08\uC561 ('+cur.kl+')</div><div class="v">'+F(cur.a)+'</div><div>'+cmp+'\uB300\uBE44 '+dArrow(cur.a,prv.a)+'</div></div>'+
  '<div class="S"><div class="l">\uC9C1\uC804 '+unit+' \uC608\uC57D ('+prv.kl+')</div><div class="v">'+prv.b.toLocaleString()+'\uAC74</div><div class="s">'+F(prv.a)+'</div></div>'+
  '<div class="S"><div class="l">\uAE30\uAC04 \uD3C9\uADE0(\uAC74)</div><div class="v">'+Math.round(a.reduce(function(t,x){return t+x.b},0)/a.length).toLocaleString()+'\uAC74</div><div class="s">'+a.length+'\uAC1C '+unit+' \uD3C9\uADE0</div></div>'+

var _hotelsCache=null,_hotelsCachePromise=null,_starSyncDone=false;
function loadHotels(){
  if(_hotelsCachePromise)return _hotelsCachePromise;
  _hotelsCachePromise=(window.TW&&window.TW.db&&window.TW.db.getAllHotels?window.TW.db.getAllHotels():Promise.resolve({data:[],error:'no-tw'})).then(function(r){_hotelsCache=(r&&r.data)?r.data:[];return _hotelsCache;}).catch(function(e){console.warn('loadHotels error:',e);_hotelsCache=[];return _hotelsCache;});
  return _hotelsCachePromise;
}
function nNm(s){return(s||'').toString().toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]/g,'');}
function findHotel(name,city,country){
  if(!_hotelsCache||!name)return null;
  var nName=nNm(name);
  var hit=_hotelsCache.find(function(h){return nNm(h.hotel_name)===nName;});
  if(hit)return hit;
  if(city){
    var nCity=nNm(city);
    hit=_hotelsCache.find(function(h){return nNm(h.city)===nCity&&(nNm(h.hotel_name).indexOf(nName)!==-1||nName.indexOf(nNm(h.hotel_name))!==-1);});
  }
  return hit||null;
}

  var co=DS.co||(DS.cd_ci&&DS.cd_ci.co)||(DS.h_ht&&DS.h_ht.co)||(DS.patHt&&DS.patHt.co)||(DS.b2bHt&&DS.b2bHt.co);

    if(status){status.textContent='\uC2E4\uC2DC\uAC04 \uB3D9\uAE30\uD654';status.style.color='#0a7c3a';}

async function _BKA_load(){
  if(_BKA_loaded||_BKA_loading) return;
  _BKA_loading=true;
  var badge=document.getElementById('bka-asof');
  if(badge) badge.innerHTML='\u23F3 자료를 불러오는 중…';
  try{

    var r=await fetch('/api/booking-analytics',{credentials:'same-origin',headers:hd});
    var j=await r.json();
    if(!j||!j.ok) throw new Error((j&&j.error)||'불러오지 못했습니다');
    D=j.D; _BKA_loaded=true;
    if(badge){
      var t=j.as_of? new Date(j.as_of) : new Date();
      badge.innerHTML='\u2705 <b>지금 자료입니다</b> — '+t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+' 기준 · 예약 <b>'+(D.sm.tb||0).toLocaleString()+'</b>건';
      badge.parentNode.style.borderColor='rgba(78,222,163,.40)';
      badge.parentNode.style.background='rgba(78,222,163,.09)';
      badge.parentNode.style.color='#8fe3c0';
    }
    try{ dc(); }catch(e){}
    try{ rr(); }catch(e){ console.error('[BKA] rr failed', e); }   /* 그리는 함수 = rr() */
    try{ setTimeout(function(){ try{ syncStarRatings(); }catch(e){} }, 200); }catch(e){}
  }catch(e){
    if(badge) badge.innerHTML='\u26A0\uFE0F 자료를 불러오지 못했습니다 — '+(e.message||e)+'. 새로고침 해 보세요.';
  }
  _BKA_loading=false;
}

/* ============================================================
 * [v2 Aurora 20차] Standalone 진입 가드 + topbar 바인딩
 * - admin.html embed 시: ba-topbar 마크업이 없음 → 가드/바인딩 우회
 * - admin.html이 BKA.mount() 호출하는 경로는 _BKA_mount 그대로 유지
 * ============================================================ */
function _BKA_standaloneBoot(){
  var topbar = document.getElementById('ba-topbar');
  // admin embed 환경 (topbar 마크업 없음) → 인증·바인딩 우회, mount만
  if (!topbar) { _BKA_mount(); return; }

  var T = global.TW;
  if (!T || typeof T.requireAuth !== 'function') {
    // shared.js 미로딩 환경 안전망 — 인증 없이 마운트 (개발/디버깅 한정)
    console.warn('[BKA] window.TW.requireAuth not available — fallback mount');
    _BKA_mount();
    return;
  }

  T.requireAuth(async function(user){
    // BL-COMMON-HEADER-UNIFY
    if (typeof T.renderCommonHeader === 'function') {
      T.renderCommonHeader({ activeTab: 'analytics' });
    }
    // topbar user-email 표시 (legacy ba-user-email span도 호환)
    var ueEl = document.getElementById('ba-user-email');
    if (ueEl && user && user.email) ueEl.textContent = user.email;
    // logout 버튼 바인딩
    var btnOut = document.getElementById('ba-btn-logout');
    if (btnOut) btnOut.addEventListener('click', function(){ T.logout(); });
    // 관리자 status 라우팅: 매니저 페이지로 잘못 들어왔으면 admin.html로
    if (typeof T.checkAdmin === 'function') {
      try {
        var ac = await T.checkAdmin(user);
        if (ac && ac.is_admin) {
          window.location.href = 'admin.html';
          return;
        }
      } catch(e){ console.warn('[BKA] checkAdmin failed', e); }
    }
    // 인증 통과 → 정상 마운트
    _BKA_mount();
  });
}
